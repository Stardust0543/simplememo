<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메모장</title><style>*{box-sizing:border-box}body{font:16px sans-serif;background:white;max-width:600px;margin:32px auto;padding:16px}section,article{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}input,textarea,button{font:inherit;padding:10px;max-width:100%}input,textarea{display:block;width:100%;margin:8px 0}textarea{min-height:120px}button{cursor:pointer;margin:4px}p{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}</style><h1>메모장</h1><p id="status" role="status"></p><section id="auth"><label>이메일<input id="email" type="email" autocomplete="username"></label><label>비밀번호<input id="password" type="password" minlength="6" autocomplete="current-password"></label><button id="login">로그인</button><button id="signup">회원가입</button></section><section id="app" hidden><button id="logout">로그아웃</button><label>메모 내용<textarea id="content" maxlength="10000"></textarea></label><button id="save">저장</button><div id="list"></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script>const db=supabase.createClient('https://tcveqhdxcdkuxjyxvxva.supabase.co','sb_publishable_KlA5b6Bks1_dAdAhUGZ23Q_dgdQM_0P');const el=id=>document.getElementById(id);let user;async function run(fn){el('status').textContent='처리 중…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();el('status').textContent='';}catch(e){el('status').textContent='오류: '+e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}async function load(){const {data,error}=await db.from('memos').select('*').order('created_at',{ascending:false});if(error)throw error;el('list').replaceChildren();for(const memo of data){const a=document.createElement('article'),p=document.createElement('p'),b=document.createElement('button');p.textContent=memo.content;b.textContent='삭제';b.onclick=()=>run(async()=>{const {error}=await db.from('memos').delete().eq('id',memo.id);if(error)throw error;await load();});a.append(p,b);el('list').append(a);}}async function sync(){const {data,error}=await db.auth.getSession();if(error)throw error;user=data.session?.user;el('auth').hidden=!!user;el('app').hidden=!user;if(user)await load();else el('list').replaceChildren();}for(const action of ['login','signup'])el(action).onclick=()=>run(async()=>{const credentials={email:el('email').value.trim(),password:el('password').value};const {data,error}=await (action==='login'?db.auth.signInWithPassword(credentials):db.auth.signUp(credentials));if(error)throw error;if(!data.session)throw Error('이메일 확인 설정을 확인해 주세요.');el('password').value='';await sync();});el('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;await sync();});el('save').onclick=()=>run(async()=>{const content=el('content').value.trim();if(!content)throw Error('메모를 입력해 주세요.');el('status').textContent='저장 중…';const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;el('content').value='';await load();});db.auth.onAuthStateChange(()=>setTimeout(()=>run(sync),0));run(sync);</script></html>
